{% extends "base.html" %}

{% block title %}Page Not Found – Smart Canteen{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <h1 class="display-1 fw-bold text-danger">404</h1>
    <h3 class="fw-bold mb-3">Oops! Dish or Page Not Found</h3>
    <p class="text-muted mb-4">The page you were looking for seems to have been cooked and eaten.</p>
    <a href="{{ url_for('index') }}" class="btn btn-brand rounded-pill px-4 py-2">
      <i class="fa-solid fa-house me-1"></i> Return Home
    </a>
  </div>
</div>
{% endblock %}
