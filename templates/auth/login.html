{% extends "base.html" %}

{% block title %}Login – Smart Canteen{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      
      <!-- Login Card -->
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden bg-white">
        <div class="p-4 p-md-5">
          
          <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
              <i class="fa-solid fa-utensils"></i>
            </div>
            <h4 class="fw-bold mb-1">Welcome Back</h4>
            <p class="text-muted small">Sign in to your Smart Canteen account</p>
          </div>

          <form action="{{ url_for('auth.login') }}" method="POST">
            <div class="mb-3">
              <label class="form-label fw-semibold small text-muted">Email or Student ID</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-envelope text-muted"></i></span>
                <input type="text" id="login-identifier" name="identifier" class="form-control bg-light border-start-0" placeholder="Enter your email or roll number" required autocomplete="username">
              </div>
            </div>

            <div class="mb-4">
              <div class="d-flex justify-content-between">
                <label class="form-label fw-semibold small text-muted">Password</label>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                <input type="password" id="login-password" name="password" class="form-control bg-light border-start-0" placeholder="Enter your password" required autocomplete="current-password">
              </div>
            </div>

            <button type="submit" class="btn btn-brand w-100 py-2 rounded-pill fw-bold">Sign In</button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <span class="text-muted small">New to campus? </span>
            <a href="{{ url_for('auth.register') }}" class="text-danger fw-bold text-decoration-none small">Create Student Account</a>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
