{% extends "base.html" %}

{% block title %}Register Student Account – Smart Canteen{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden bg-white">
        <div class="p-4 p-md-5">
          
          <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
              <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h4 class="fw-bold mb-1">Student Registration</h4>
            <p class="text-muted small">Join your college smart dining platform & get ₹500 starting wallet balance!</p>
          </div>

          <form action="{{ url_for('auth.register') }}" method="POST">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold small text-muted">Full Name *</label>
                <input type="text" name="name" class="form-control bg-light" placeholder="Your Full Name" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold small text-muted">Student Roll ID *</label>
                <input type="text" name="student_id" class="form-control bg-light text-uppercase" placeholder="STU2026101" required>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold small text-muted">Email Address *</label>
                <input type="email" name="email" class="form-control bg-light" placeholder="student@college.edu" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold small text-muted">Phone Number</label>
                <input type="tel" name="phone" class="form-control bg-light" placeholder="9876543210">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold small text-muted">Dietary Preference</label>
              <select name="dietary_pref" class="form-select bg-light">
                <option value="veg" selected>Vegetarian (Veg Only)</option>
                <option value="all">All (Veg & Non-Veg)</option>
                <option value="vegan">Vegan</option>
              </select>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label fw-semibold small text-muted">Password *</label>
                <input type="password" name="password" class="form-control bg-light" placeholder="Min 6 chars" required minlength="6">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold small text-muted">Confirm Password *</label>
                <input type="password" name="confirm_password" class="form-control bg-light" placeholder="Re-type password" required minlength="6">
              </div>
            </div>

            <button type="submit" class="btn btn-brand w-100 py-2 rounded-pill fw-bold">Create Account</button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <span class="text-muted small">Already registered? </span>
            <a href="{{ url_for('auth.login') }}" class="text-danger fw-bold text-decoration-none small">Sign In here</a>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
